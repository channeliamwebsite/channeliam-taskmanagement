<!--
  Supabase Auth "Reset password" email. In production, paste this into
  Authentication -> Email Templates -> Reset password (and set Site URL to the app URL).
  The link goes to the app's /auth/confirm route, which verifies the one-time
  token on the server and then asks the employee to choose a new password.
  The default template links through Supabase's /verify endpoint instead, which
  puts the session in the URL fragment where the server cannot read it.
-->
<h2>Reset your Channeliam Task Management password</h2>
<p>We received a request to reset the password for this account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a>
</p>
<p>This link can be used once and expires in one hour. If you didn't ask for a reset, you can ignore this email; your password stays the same.</p>
